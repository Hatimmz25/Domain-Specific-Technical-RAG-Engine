name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    name: Trigger Automated Production Deployment
    runs-on: ubuntu-latest
    # Trigger only if CI completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping automated deployment."
            exit 0
          fi
          echo "Triggering deployment..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "✓ Deploy hook triggered successfully."