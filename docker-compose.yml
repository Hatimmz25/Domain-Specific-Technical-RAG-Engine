services:
  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI + Technical RAG Engine)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - LLM_MODEL=bartowski/Qwen2.5-3B-Instruct-GGUF
      - LLM_MODEL_FILE=Qwen2.5-3B-Instruct-Q8_0.gguf
      - ALLOWED_CORS_ORIGINS=["http://localhost:8501","http://localhost:8000"]
    volumes:
      - rag_data_volume:/app/data
      - rag_index_volume:/app/indexes
      - rag_models_volume:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Frontend UI Service (Streamlit Dashboard)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  rag_data_volume:
    driver: local
  rag_index_volume:
    driver: local
  rag_models_volume:
    driver: local